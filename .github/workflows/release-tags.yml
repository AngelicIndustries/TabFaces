
name: Release tagged build

on:
  push:
    tags: [ '*' ]

permissions:
  contents: write

jobs:
  release-tags:
    uses: AngelicIndustries/GTNH-Actions-Workflows/.github/workflows/release-tags.yml@master
    secrets:
      MAVEN_USER: ${{ secrets.MAVEN_USER }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
  publish-67minecraft:
    runs-on: ubuntu-24.04
    needs: release-tags
    env:
      VERSION: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ github.ref_name }}
      SIX_SEVEN_TOKEN: ${{ secrets.SIX_SEVEN_TOKEN }}

    steps:
      - name: Checkout mod repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 32
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Fetch the OvermindDL1 mirror from the Angelic Maven
        # gtnhgradle adds https://gregtech.overminddl1.com/, which often times out on GitHub's runners; maven.angelic.industries mirrors it
        shell: bash
        run: |
          mkdir -p ~/.gradle/init.d
          curl -fsSL --retry 3 -o ~/.gradle/init.d/angelic-mirror.gradle https://raw.githubusercontent.com/AngelicIndustries/mod-workflows/v1/gradle/angelic-mirror.init.gradle

      - name: Publish to 67minecraft
        run: ./gradlew clean publish67Minecraft --no-configuration-cache --build-cache --info --stacktrace -x test
